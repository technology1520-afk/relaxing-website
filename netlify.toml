[build]
  publish = "builds/relaxing-travel"
  functions = "netlify/functions"
  # _kb.js reads the destination knowledge base at runtime — ship the JSON
  # with every function bundle or Lambda crashes with ENOENT on load.
  included_files = ["builds/relaxing-travel/data/kb/*.json"]

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "/api/suggest"
  to = "/.netlify/functions/suggest"
  status = 200

[[redirects]]
  from = "/api/plan"
  to = "/.netlify/functions/plan"
  status = 200

[[redirects]]
  from = "/api/admin-data"
  to = "/.netlify/functions/admin-data"
  status = 200

[[redirects]]
  from = "/api/track"
  to = "/.netlify/functions/track"
  status = 200

[[redirects]]
  from = "/api/mcp"
  to = "/.netlify/functions/mcp"
  status = 200

# MCP endpoint is machine-only: block browser cross-origin reads of it via CSP not needed;
# the secret token is the gate.

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
