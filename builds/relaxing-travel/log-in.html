<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Log in · Relax Day Off</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B1020">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230B1020'/><circle cx='16' cy='16' r='6' fill='%23E8A852'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="scrollcraft.css">
<style>
  :root {
    --sc-canvas: #0B1020; --sc-surface: #131A2E; --sc-ink: #F2EEE6;
    --sc-ink-soft: #9BA3B5; --sc-accent: #E8A852; --sc-accent-ink: #1A1207;
    --sc-font-display: "Archivo", system-ui, sans-serif;
    --sc-font-text: "Outfit", system-ui, sans-serif;
  }
  body { background: var(--sc-canvas); }
  .auth-wrap { min-height: 100vh; display: grid; place-items: center; padding: 2rem 1.25rem; position: relative; overflow: hidden; }
  .auth-back {
    position: absolute; inset: 0; opacity: 0.16; object-fit: cover; width: 100%; height: 100%;
    mask-image: radial-gradient(circle at 50% 40%, black 30%, transparent 75%);
    -webkit-mask-image: radial-gradient(circle at 50% 40%, black 30%, transparent 75%);
  }
  .auth-card {
    position: relative; z-index: 2; width: min(26rem, 100%);
    background: color-mix(in srgb, var(--sc-surface) 92%, transparent);
    border: 1px solid color-mix(in srgb, var(--sc-ink) 10%, transparent);
    border-radius: 18px; padding: clamp(1.6rem, 4vw, 2.4rem);
    box-shadow: var(--sc-e3); backdrop-filter: blur(8px);
  }
  .auth-mark { font-family: var(--sc-font-display); font-weight: 600; font-size: 1.3rem; color: var(--sc-ink); text-decoration: none; display: inline-block; margin-bottom: 1.4rem; }
  .auth-mark em { color: var(--sc-accent); font-style: normal; }
  .auth-card h1 { font-family: var(--sc-font-display); font-size: 1.5rem; font-weight: 600; margin: 0 0 0.4rem; color: var(--sc-ink); }
  .auth-sub { color: var(--sc-ink-soft); font-size: 0.92rem; margin: 0 0 1.6rem; }
  .field { margin-bottom: 1rem; }
  .field label { display: block; font-size: 0.85rem; color: var(--sc-ink-soft); margin-bottom: 0.35rem; }
  .field input {
    width: 100%; box-sizing: border-box; background: var(--sc-canvas); color: var(--sc-ink);
    border: 1px solid color-mix(in srgb, var(--sc-ink) 18%, transparent);
    border-radius: 10px; padding: 0.75rem 0.9rem; font: inherit; font-size: 0.95rem;
  }
  .field input:focus-visible { outline: 2px solid var(--sc-accent); outline-offset: 1px; }
  .auth-btn {
    width: 100%; background: var(--sc-accent); color: var(--sc-accent-ink); border: 0;
    border-radius: 10px; padding: 0.8rem; font: inherit; font-weight: 500; font-size: 1rem;
    cursor: pointer; margin-top: 0.4rem; transition: filter 120ms var(--sc-ease-out), transform 120ms var(--sc-ease-out);
  }
  .auth-btn:hover { filter: brightness(1.06); }
  .auth-btn:active { transform: scale(0.98); }
  .auth-btn[disabled] { opacity: 0.6; cursor: wait; }
  .auth-alt { text-align: center; font-size: 0.9rem; color: var(--sc-ink-soft); margin-top: 1.3rem; }
  .auth-alt a { color: var(--sc-accent); }
  .g-btn { background: var(--sc-surface); color: var(--sc-ink); border: 1.5px solid var(--sc-ink); display: flex; align-items: center; justify-content: center; gap: 0.6rem; margin-top: 0; }
  .g-btn:hover { background: color-mix(in srgb, var(--sc-ink) 6%, var(--sc-surface)); }
  .or { display: flex; align-items: center; gap: 0.8rem; margin: 0.9rem 0; color: var(--sc-ink-soft); font-size: 0.8rem; }
  .or::before, .or::after { content: ""; flex: 1; height: 1px; background: color-mix(in srgb, var(--sc-ink) 15%, transparent); }
  .auth-msg { min-height: 1.4em; margin-top: 0.9rem; font-size: 0.88rem; }
  .auth-msg.err { color: #E5A9A0; }
  .auth-backlink { position: fixed; top: 1.2rem; left: 1.4rem; z-index: 5; color: var(--sc-ink-soft); text-decoration: none; font-size: 0.9rem; }
  .auth-backlink:hover { color: var(--sc-accent); }
</style>
</head>
<body>
<a class="auth-backlink" href="/">← Back to Relax Day Off</a>
<div class="auth-wrap">
  <img class="auth-back" src="assets/hero-lagoon.jpg" alt="" aria-hidden="true">
  <div class="auth-card">
    <a class="auth-mark" href="/">Relax Day<em>Off</em></a>
    <h1>Welcome back</h1>
    <p class="auth-sub">Log in to reach your saved trips.</p>
    <form id="login-form" novalidate>
      <div class="field">
        <label for="li-email">Email</label>
        <input id="li-email" name="email" type="email" autocomplete="email" required>
      </div>
      <div class="field">
        <label for="li-pass">Password</label>
        <input id="li-pass" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="auth-btn g-btn" id="li-google" type="button">
        <svg width="18" height="18" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
        Continue with Google
      </button>
      <div class="or"><span>or</span></div>
      <button class="auth-btn" id="li-go" type="submit">Log in</button>
      <p class="auth-msg" id="li-msg" aria-live="polite"></p>
    </form>
    <p class="auth-alt">New here? <a href="sign-up.html">Create an account</a></p>
  </div>
</div>

<script src="https://unpkg.com/netlify-identity-widget@1.9.2/build/netlify-identity-widget.js"></script>
<script>
window.netlifyIdentity?.on("init", user => { if (user) location.href = "account.html"; });

document.getElementById("li-google").addEventListener("click", () => {
  const identity = window.netlifyIdentity;
  if (!identity) { const m = document.getElementById("li-msg"); m.className = "auth-msg err"; m.textContent = "Google sign-in works on the deployed site (relaxdayoff.com), not here."; return; }
  identity.login("google", true);
});

document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("li-msg");
  const btn = document.getElementById("li-go");
  const email = document.getElementById("li-email").value.trim();
  const pass = document.getElementById("li-pass").value;
  msg.className = "auth-msg"; msg.textContent = "";
  const identity = window.netlifyIdentity;
  if (!identity) { msg.textContent = "Auth is not available in this environment. Deploy to Netlify and enable Identity."; msg.classList.add("err"); return; }
  btn.disabled = true; msg.textContent = "Logging in…";
  try {
    const user = await new Promise((resolve, reject) => {
      identity.login(email, pass, true, (err, u) => err ? reject(err) : resolve(u));
    });
    if (user?.token?.access_token) location.href = "account.html";
    else { msg.textContent = "Check your email to confirm the account first."; msg.classList.add("err"); }
  } catch (err) {
    msg.className = "auth-msg err";
    msg.textContent = String(err?.error_description || err?.message || err).slice(0, 160) || "Login failed. Try again.";
  } finally { btn.disabled = false; }
});
</script>
</body>
</html>
