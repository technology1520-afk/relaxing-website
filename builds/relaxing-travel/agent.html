<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Relaxagent · Relax Day Off</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B1020">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230B1020'/><circle cx='16' cy='16' r='6' fill='%23E8A852'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="scrollcraft.css">
<style>
  :root {
    --sc-canvas: #0B1020; --sc-surface: #131A2E; --sc-ink: #F2EEE6;
    --sc-ink-soft: #9BA3B5; --sc-accent: #E8A852; --sc-accent-ink: #1A1207;
    --sc-font-display: "Archivo", system-ui, sans-serif;
    --sc-font-text: "Outfit", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { background: var(--sc-canvas); color: var(--sc-ink); font-family: var(--sc-font-text); margin: 0; }

  .agent-shell { display: flex; flex-direction: column; height: 100dvh; max-width: 54rem; margin: 0 auto; padding: 0 1rem; }
  .agent-top { display: flex; align-items: center; gap: 0.8rem; padding: 1rem 0.2rem 0.8rem; border-bottom: 1px solid color-mix(in srgb, var(--sc-ink) 12%, transparent); }
  .agent-top .mark { font-family: var(--sc-font-display); font-weight: 600; color: var(--sc-ink); text-decoration: none; }
  .agent-top .mark em { color: var(--sc-accent); font-style: normal; }
  .agent-avatar {
    width: 2.4rem; height: 2.4rem; border-radius: 50%; flex: none;
    background: radial-gradient(circle at 35% 30%, var(--sc-accent), #B0533A);
    display: grid; place-items: center; font-size: 1.1rem;
  }
  .agent-id { display: flex; flex-direction: column; line-height: 1.25; }
  .agent-id strong { font-family: var(--sc-font-display); font-size: 1rem; }
  .agent-id span { font-size: 0.78rem; color: var(--sc-ink-soft); }
  .agent-top .home-link { margin-left: auto; color: var(--sc-ink-soft); text-decoration: none; font-size: 0.88rem; }
  .agent-top .home-link:hover { color: var(--sc-accent); }

  .agent-log { flex: 1; overflow-y: auto; padding: 1.4rem 0.2rem 1rem; display: flex; flex-direction: column; gap: 0.9rem; scrollbar-width: thin; }
  .msg { max-width: 82%; padding: 0.8rem 1.05rem; border-radius: 16px; font-size: 0.97rem; line-height: 1.55; white-space: pre-wrap; word-wrap: break-word; }
  .msg--you { align-self: flex-end; background: var(--sc-accent); color: var(--sc-accent-ink); border-bottom-right-radius: 4px; }
  .msg--bot { align-self: flex-start; background: var(--sc-surface); border: 1px solid color-mix(in srgb, var(--sc-ink) 10%, transparent); border-bottom-left-radius: 4px; }
  .msg--err { align-self: flex-start; background: color-mix(in srgb, #E5A9A0 12%, var(--sc-surface)); color: #E5A9A0; }

  .picks { align-self: flex-start; display: grid; grid-template-columns: repeat(auto-fill, minmax(13rem, 1fr)); gap: 0.7rem; max-width: 100%; }
  .pick {
    display: flex; gap: 0.7rem; align-items: center; text-decoration: none;
    background: var(--sc-surface); border: 1px solid color-mix(in srgb, var(--sc-ink) 12%, transparent);
    border-radius: 12px; overflow: hidden; transition: transform 140ms ease, border-color 140ms ease;
  }
  .pick:hover { transform: translateY(-2px); border-color: var(--sc-accent); }
  .pick img { width: 4.2rem; height: 4.2rem; object-fit: cover; flex: none; }
  .pick-body { padding: 0.5rem 0.6rem 0.5rem 0; min-width: 0; }
  .pick-body strong { display: block; font-size: 0.86rem; color: var(--sc-ink); }
  .pick-body span { display: block; font-size: 0.72rem; color: var(--sc-ink-soft); }

  .chips { display: flex; flex-wrap: wrap; gap: 0.45rem; padding: 0 0.2rem 0.8rem; }
  .chips button {
    background: transparent; color: var(--sc-ink-soft); border: 1px solid color-mix(in srgb, var(--sc-ink) 20%, transparent);
    border-radius: 999px; padding: 0.4rem 0.9rem; font: inherit; font-size: 0.84rem; cursor: pointer;
    transition: all 140ms ease;
  }
  .chips button:hover { background: var(--sc-accent); color: var(--sc-accent-ink); border-color: var(--sc-accent); }

  .agent-inputrow { display: flex; gap: 0.6rem; padding: 0.6rem 0.2rem calc(1rem + env(safe-area-inset-bottom)); }
  .agent-inputrow input {
    flex: 1; background: var(--sc-surface); color: var(--sc-ink);
    border: 1px solid color-mix(in srgb, var(--sc-ink) 18%, transparent);
    border-radius: 12px; padding: 0.9rem 1.05rem; font: inherit; font-size: 1rem;
  }
  .agent-inputrow input:focus-visible { outline: 2px solid var(--sc-accent); outline-offset: 1px; }
  .agent-inputrow button {
    background: var(--sc-accent); color: var(--sc-accent-ink); border: 0; border-radius: 12px;
    padding: 0 1.5rem; font: inherit; font-weight: 600; font-size: 0.95rem; cursor: pointer;
    transition: filter 120ms ease;
  }
  .agent-inputrow button:hover { filter: brightness(1.07); }
  .agent-inputrow button[disabled] { opacity: 0.55; cursor: wait; }

  .thinking { display: inline-flex; gap: 0.3rem; align-items: center; }
  .thinking i { width: 0.45rem; height: 0.45rem; border-radius: 50%; background: var(--sc-ink-soft); animation: bob 1.2s infinite; }
  .thinking i:nth-child(2) { animation-delay: 0.15s; } .thinking i:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bob { 0%, 60%, 100% { transform: none; opacity: 0.5; } 30% { transform: translateY(-0.25rem); opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .thinking i { animation: none; } }
</style>
</head>
<body>
<div class="agent-shell">
  <header class="agent-top">
    <div class="agent-avatar">🐢</div>
    <div class="agent-id">
      <strong>Relaxagent</strong>
      <span>Your day-off guide · knows every place on this site</span>
    </div>
    <a class="home-link" href="/">← relaxdayoff.com</a>
  </header>

  <main class="agent-log" id="log" aria-live="polite"></main>

  <div class="chips" id="chips"></div>

  <form class="agent-inputrow" id="askform">
    <input id="q" type="text" autocomplete="off" maxlength="400"
      placeholder="Ask anything — vibes, seasons, prices, visas, kids…" aria-label="Ask Relaxagent">
    <button id="go" type="submit">Send</button>
  </form>
</div>

<script type="module">
import { KB } from "./js/kb-data.js?v=3";

const log = document.getElementById("log");
const chipsEl = document.getElementById("chips");
const input = document.getElementById("q");
const goBtn = document.getElementById("go");
const INDEX = Object.values(KB);
const go = (href) => location.href = href;

const SUGGESTIONS = [
  "Where should I go to fully switch off?",
  "Quiet beach under $70 a day?",
  "Best place for stargazing?",
  "Is Kyoto good with kids?",
  "Cheapest trip from Phnom Penh",
  "Where do I see northern lights?",
];

function addMsg(text, cls) {
  const el = document.createElement("div");
  el.className = "msg " + cls;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

function thinkingEl() {
  const el = document.createElement("div");
  el.className = "msg msg--bot";
  el.innerHTML = '<span class="thinking"><i></i><i></i><i></i></span>';
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

function renderPicks(picks) {
  if (!Array.isArray(picks) || !picks.length) return;
  const wrap = document.createElement("div");
  wrap.className = "picks";
  wrap.innerHTML = picks.slice(0, 3).map(p => `
    <a class="pick" href="/#plan" data-key="${p.key || ""}">
      <img src="${p.image || "assets/" + (p.key || "") + ".webp"}" alt="" loading="lazy" width="120" height="120">
      <span class="pick-body">
        <strong>${p.flag || ""} ${p.name || p.city || ""}</strong>
        <span>${[p.tagline, p.daily_mid ? "~$" + p.daily_mid + "/day" : ""].filter(Boolean).join(" · ") || (p.country || "")}</span>
      </span>
    </a>`).join("");
  log.appendChild(wrap);
  log.scrollTop = log.scrollHeight;
}

// One-shot context the floating bubble doesn't have room for: the full KB index.
function siteContext() {
  const shortlist = INDEX
    .slice()
    .sort((a, b) => a.daily_mid - b.daily_mid)
    .map(e => `${e.flag || ""} ${e.city}, ${e.country} — ${e.monthsLabel || "year-round"}, ~$${e.daily_mid}/day mid`)
    .join("; ");
  return { allPlaces: shortlist, count: INDEX.length };
}

let busy = false;
async function ask(q) {
  if (busy || !q.trim()) return;
  busy = true;
  goBtn.disabled = true;
  addMsg(q, "msg--you");
  const wait = thinkingEl();
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 45000);
    let res = await fetch("/api/ask", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question: q, context: { page: "agent", site: siteContext() } }),
      signal: ctrl.signal,
    });
    if (!res.ok) { // provider can be slow — one silent retry
      await new Promise(r => setTimeout(r, 900));
      res = await fetch("/api/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: q, context: { page: "agent", site: siteContext() } }),
        signal: ctrl.signal,
      });
    }
    clearTimeout(timer);
    let data = null;
    try { data = await res.json(); } catch {}
    wait.remove();
    if (data?.answer) {
      addMsg(data.answer, "msg--bot");
      renderPicks(data.picks);
    } else {
      addMsg("I couldn't reach my notes just now. Try once more — or ask me about a specific place.", "msg--err");
    }
  } catch {
    wait.remove();
    addMsg("Connection timed out. The guide is thinking slowly today — try again.", "msg--err");
  }
  busy = false;
  goBtn.disabled = false;
  input.focus();
}

SUGGESTIONS.forEach(s => {
  const b = document.createElement("button");
  b.type = "button"; b.textContent = s;
  b.addEventListener("click", () => ask(s));
  chipsEl.appendChild(b);
});

document.getElementById("askform").addEventListener("submit", (e) => {
  e.preventDefault();
  const q = input.value;
  input.value = "";
  ask(q);
});

addMsg("Hi — I'm Relaxagent. I know all " + INDEX.length + " quiet places on this site: what they cost, when to go, what the crowds do, and which one fits your week. What are you in the mood for?", "msg--bot");
input.focus();
</script>
</body>
</html>
