<link rel="stylesheet" href="/scrollcraft.css">
<style>
  :root {
    --sc-canvas: #0B1020; --sc-surface: #131A2E; --sc-ink: #F2EEE6;
    --sc-ink-soft: #9BA3B5; --sc-accent: #E8A852; --sc-accent-ink: #1A1207;
    --sc-font-display: "Archivo", system-ui, sans-serif;
    --sc-font-text: "Outfit", system-ui, sans-serif;
  }
  body { background: var(--sc-canvas); }
  .nf-wrap { min-height: 100vh; display: grid; place-items: center; padding: 2rem 1.25rem; }
  .nf-card { text-align: center; max-width: 30rem; }
  .nf-code { font-family: var(--sc-font-display); font-weight: 600; font-size: clamp(4rem, 14vw, 7rem); color: var(--sc-accent); margin: 0; line-height: 1; }
  .nf-card h1 { font-family: var(--sc-font-display); font-weight: 600; font-size: 1.4rem; color: var(--sc-ink); margin: 0.8rem 0 0.5rem; }
  .nf-card p { color: var(--sc-ink-soft); font-size: 0.95rem; margin: 0 0 1.8rem; }
  .btn {
    background: var(--sc-accent); color: var(--sc-accent-ink); border: 0; border-radius: 10px;
    padding: 0.7rem 1.3rem; font: inherit; font-size: 0.95rem; font-weight: 500; cursor: pointer;
    text-decoration: none; display: inline-block;
  }
  .btn:hover { filter: brightness(1.06); }
  .ghost { background: transparent; color: var(--sc-ink-soft); border: 1px solid color-mix(in srgb, var(--sc-ink) 18%, transparent); margin-left: 0.6rem; }
  .ghost:hover { color: var(--sc-ink); }
</style>
</head>
<body>
<div class="nf-wrap">

    <h1>This path leads nowhere quiet</h1>
    <p>The page you were looking for doesn't exist — but the quietest places on earth do.</p>
    <a class="btn" href="/">Back to Relax Day Off</a>
    <a class="btn ghost" href="/#explore">Explore destinations</a>
  </div>
</div>
</body>
